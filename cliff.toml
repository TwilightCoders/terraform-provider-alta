# Changelog generation. Commit subjects in this repository are written as sentences
# describing the change, so they are used as-is rather than parsed into scopes.
[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | split(pat=": ") | last }}{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(build|ci):", group = "Build" },
  { message = "^docs:", group = "Documentation" },
  { message = "^test:", group = "Tests" },
  { message = ".*", group = "Changes" },
]
tag_pattern = "v[0-9]*"
